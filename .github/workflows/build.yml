name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Configure native renderer
        run: cmake -S native/ElyFlow.Native -B native/ElyFlow.Native/build -A x64

      - name: Build native renderer
        run: cmake --build native/ElyFlow.Native/build --config Release

      - name: Restore
        run: dotnet restore "ElyCast TV Player.csproj"

      - name: Build managed application
        run: dotnet build "ElyCast TV Player.csproj" -c Release -p:Platform=x64 --no-restore

      - name: Run regression checks
        run: dotnet run --project tests/ElyCast.Regression/ElyCast.Regression.csproj -c Release

      - name: Run catalog and persistence regression checks
        run: dotnet run --project tests/ElyCast.CoreRegression/ElyCast.CoreRegression.csproj -c Release -p:Platform=x64

      - name: Publish Windows x64 application
        run: dotnet publish "ElyCast TV Player.csproj" -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=None -o artifacts/publish

      - name: Upload release components
        uses: actions/upload-artifact@v4
        with:
          name: ElyCast-release-components-${{ github.sha }}
          path: |
            artifacts/publish/ElyCast.exe
            artifacts/publish/ElyCastLogo.png
            artifacts/publish/glfw3.dll
            native/ElyFlow.Native/bin/Release/ElyFlow.Native.dll
          if-no-files-found: error
          retention-days: 7
